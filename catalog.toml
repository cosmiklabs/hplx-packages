# The HPLX catalog: every HPL-family game the app lists, and what HPLX can do with each.
# The app knows no game itself; it reads this file (schema 1).
#
# Per game:
# - id, name, engine (HPL1, HPL2, HPL3), developer, year: what the app shows.
# - parent: the game whose install this one lives in (Justine in The Dark Descent, Requiem in
#   Black Plague); it shares the parent's copy.
# - short_name: optional; how the game is named beneath its parent ("Requiem").
# - play: the game's HPLX version.
#     "available": an HPLX package exists; `package` is the id its hplx-game.toml declares.
#     "planned": planned; `play_note` says why it can or cannot start.
# - play_note: one sentence for the game's page, in plain English.
# - stories: what this game calls custom content ("custom story", "mod"), or absent if it has none.
# - edit: the editor's support for this game. "planned" until the editor exists.
# - [game.copy]: where the app looks for your copy of the game. steam_folder is its folder
#   under a Steam library's steamapps/common. The game itself says whether a folder is a copy.
# - [game.download.<platform>]: where an available HPLX package's zip is (url) and its SHA-256
#   (sha256, hex), with optional size in bytes, per platform ("windows-x86_64"). The zip holds the game's hplx-game.toml and
#   executable at its root. Without one, the game's page says there is no download yet.
# - [game.retail.<os>]: original executable relative to the install (forward slashes), with
#   optional args. Independent of the HPLX version. Only add shortcuts verified on that OS.

schema = 1

[[game]]
id = "penumbra-overture"
name = "Penumbra: Overture"
engine = "HPL1"
developer = "Frictional Games"
year = 2007
play = "planned"
play_note = "Penumbra's engine source has been released, so HPLX can rebuild its rules from it. Work hasn't started yet."
edit = "planned"

