# The HPLX catalog: every HPL-family game the launcher lists, and what HPLX can do with each.
# The launcher knows no game itself; it reads this file (schema 1).
#
# Per game:
# - id, name, engine (HPL1, HPL2, HPL3), developer, year: what the launcher shows.
# - parent: the game whose install this one lives in (Justine in The Dark Descent, Requiem in
#   Black Plague); it shares the parent's copy.
# - short_name: optional; how the game is named beneath its parent ("Requiem").
# - redux: the game's Redux version.
#     "available": a Redux package exists; `package` is the id its hplx-game.toml declares.
#     "planned": planned; `redux_note` says why it can or cannot start.
# - redux_note: one sentence for the game's page, in plain English.
# - stories: what this game calls custom content ("custom story", "mod"), or absent if it has none.
# - edit: the editor's support for this game. "planned" until the editor exists.

schema = 1

[[game]]
id = "penumbra-overture"
name = "Penumbra: Overture"
engine = "HPL1"
developer = "Frictional Games"
year = 2007
redux = "planned"
redux_note = "Penumbra's engine source has been released, so HPLX can rebuild its rules from it. Work hasn't started yet."
edit = "planned"

