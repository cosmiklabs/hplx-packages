# Actions stays disabled while private. No cross-repository private access token is needed.
name: catalog
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: hplx-packages
      - uses: actions/checkout@v4
        with:
          repository: cosmiklabs/hplx-launcher
          path: hplx-launcher
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Validate with the consumer
        working-directory: hplx-packages
        run: just check
